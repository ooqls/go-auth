redis:
  name: redis
  host: localhost
  port: 6379
  tls:
    enabled: true
    cert_path: /app/tls/server.pem
    key_path: /app/tls/server.key.pem
    ca_path: /app/tls/ca.pem
    insecure_skip_tls_verify: false
  auth:
    enabled: false
    username: ""
    password: ""
  extra: {}
  database: "1"
postgres:
  name: postgres
  host: localhost
  port: 5432
  tls:
    enabled: true
    cert_path: /app/tls/server.pem
    key_path: /app/tls/server.key.pem
    ca_path: /app/tls/ca.pem
    insecure_skip_tls_verify: false
  auth:
    enabled: false
    username: ""
    password: ""
  extra: {}
  database: appdb
