openapi: 3.0.0
servers:
  - url: https://localhost:8080/api/v1
    description: Local server
  - url: https://auth:8080/api/v1
info:
  title: Authorization Permission Bindings
  version: 1.0.0
components:
  schemas:
    PermissionBinding:
      type: object
      required:
        - role_id
        - permission_id
      properties:
        role_id:
          type: string
          format: uuid
        permission_id:
          type: string
          format: uuid
    AssignRequest:
      type: object
      required:
        - role_ids
        - permission_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
    UnassignRequest:
      type: object
      required:
        - role_ids
        - permission_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
paths:
  /auth/permission-binding/:
    get:
      operationId: listPermissionBindings
      summary: Retrieves all permission bindings
      parameters:
        - name: page
          in: query
          description: The page number
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          description: The page size
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful permission binding retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionBinding"
        '401':
          description: Invalid credentials
    post:
      operationId: assignPermission
      summary: Assign permissions to roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        '200':
          description: Permissions successfully assigned
        '401':
          description: Invalid credentials
    delete:
      operationId: unassignPermission
      summary: Unassign permissions from roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnassignRequest"
      responses:
        '200':
          description: Permissions successfully unassigned
        '401':
          description: Invalid credentials
  /auth/permission-binding/role/{role_id}:
    get:
      operationId: getPermissionBindingsForRole
      summary: Retrieves all permission bindings for a specific role
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful permission binding retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionBinding"
        '401':
          description: Invalid credentials
        '404':
          description: Role not found
