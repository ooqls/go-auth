openapi: 3.1.0
info:
    title: OpenAPI specification for auth
    version: 1.0.0
    description: This is the OpenAPI specification for the auth service.
servers:
    - url: https://localhost:8080/roles/api/v1
      description: Local server
    - url: https://roles:8080/api/v1
    - url: http://localhost:8080/roles/api/v1
    - url: http://roles:8080/api/v1
security:
    - cookieAuth: []
components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: OKEY
    schemas:
        RolesList:
            type: object
            required:
                - items
                - total_count
            properties:
                items:
                    type: array
                    items:
                        $ref: "schemas.yaml#/components/schemas/Role"
                total_count:
                    type: integer
        CreateRoleRequest:
            type: object
            required:
                - name
                - description
                - hierarchy
                - permissions
            properties:
                name:
                    type: string
                description:
                    type: string
                hierarchy:
                    type: integer
                permissions:
                    type: array
                    items:
                        type: string
        CreateRoleResponse:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid
        UpdateRoleRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                description:
                    type: string
                hierarchy:
                    type: integer
        AssignPermissionRequest:
            type: object
            properties:
                role_id:
                    type: string
                    format: uuid
                permissions:
                    type: array
                    items:
                        type: string
        UnassignPermissionRequest:
            type: object
            properties:
                role_id:
                    type: string
                    format: uuid
                permissions:
                    type: array
                    items:
                        type: string
        RoleBindingRequest:
            type: object
            properties:
                assign_role_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                unassign_role_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                user_id:
                    type: string
                    format: uuid

paths:
    /roles:
        get:
            summary: Get all roles
            description: Get all roles
            operationId: getAuthRoles
            parameters:
                - name: page
                  in: query
                  description: The page number
                  required: false
                  schema:
                      type: integer
                - name: page_size
                  in: query
                  description: The page size
                  required: false
                  schema:
                      type: integer
            tags:
                - roles
            responses:
                "200":
                    description: Successful role retrieval
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RolesList"
                "401":
                    description: Invalid credentials
    /role/{id}:
        get:
            operationId: getAuthRole
            parameters:
                - name: id
                  in: path
                  description: The role ID
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                "200":
                    description: Successful role retrieval
                    content:
                        application/json:
                            schema:
                                $ref: "schemas.yaml#/components/schemas/Role"
                "401":
                    description: Invalid credentials
    /role:
        post:
            operationId: createAuthRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateRoleRequest"
                required: true
            responses:
                "200":
                    description: Successful role creation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CreateRoleResponse"
                "401":
                    description: Invalid credentials
        put:
            operationId: updateAuthRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateRoleRequest"
            responses:
                "200":
                    description: Successful role update
                    content:
                        application/json:
                            schema:
                                $ref: "schemas.yaml#/components/schemas/Role"
                "401":
                    description: Invalid credentials
        delete:
            operationId: deleteAuthRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "schemas.yaml#/components/schemas/DeleteRequest"
            responses:
                "200":
                    description: Successful role deletion
                    content:
                        application/json:
                            schema:
                                $ref: "schemas.yaml#/components/schemas/DeleteResponse"
                "401":
                    description: Invalid credentials
    /role/binding:
        post:
            operationId: updateRoleBindings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RoleBindingRequest"
                required: true
            responses:
                "200":
                    description: Successful role assignment
                "401":
                    description: Invalid credentials
    /role/permissions:
        post:
            operationId: AssignRolePermissions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssignPermissionRequest"
                required: true
            responses:
                "200":
                    description: Successful permission addition
                    content:
                        application/json:
                            schema:
                                $ref: "schemas.yaml#/components/schemas/Role"
                "401":
                    description: Invalid credentials
        delete:
            operationId: UnassignRolePermissions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UnassignPermissionRequest"
                required: true
            responses:
                "200":
                    description: Successful permission deletion
                    content:
                        application/json:
                            schema:
                                $ref: "schemas.yaml#/components/schemas/Role"
                "401":
                    description: Invalid credentials
