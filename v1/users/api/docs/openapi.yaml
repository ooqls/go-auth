openapi: 3.0.0
servers:
  - url: https://localhost:8080/uers/api/v1
    description: Local server
  - url: https://users:8080/api/v1
  - url: http://localhost:8080/users/api/v1
  - url: http://users:8080/api/v1
info:
  title: Users
  version: 1.0.0
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: OKEY
  schemas:
    CurrentUserCapabilities:
      type: object
      description: >-
        Evaluated UI hints for the current user, using the same authorization
        checks as protected operations. Every protected request is still checked.
        These decisions do not grant target-specific role or resource mutation rights.
      required:
        - users_read
        - roles_read
        - permissions_read
        - permissions_create
        - resources_read
      properties:
        users_read:
          type: boolean
        roles_read:
          type: boolean
        permissions_read:
          type: boolean
        permissions_create:
          type: boolean
        resources_read:
          type: boolean
          description: Permission to read the unfiltered resource list (group=* and kind=*).
    CurrentUserResponse:
      type: object
      required:
        - user
        - capabilities
      properties:
        user:
          $ref: "schemas.yaml#/components/schemas/User"
        capabilities:
          $ref: "#/components/schemas/CurrentUserCapabilities"
    UserList:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: "schemas.yaml#/components/schemas/User"
        total_count:
          type: integer
    CreateUserRequest:
      type: object
      required:
      - username
      - email
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          minLength: 1
          maxLength: 255
        key:
          type: string
          format: byte
          minLength: 32
          maxLength: 512
        salt:
          type: string
          format: byte
          minLength: 16
          maxLength: 256
paths:
  /user/{id}:
    get:
      operationId: getUserByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful user retrieval
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/User"
        '404':
          description: User not found
        '401':
          description: Invalid credentials
    put:
      operationId: updateUserByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "schemas.yaml#/components/schemas/UpdateRequest"
        required: true
      responses:
        '200':
          description: Successful user update
        '401':
          description: Invalid credentials
    delete:
      operationId: deleteUserByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful user deletion
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/DeleteResponse"
        '401':
          description: Invalid credentials
        '404':
          description: User not found
  /user:
    get:
      operationId: getCurrentUser
      description: >-
        Returns the authenticated user's own public record and fresh capabilities.
        Does not require permission to read other users. Responses must not be cached.
      responses:
        '200':
          description: Successful user retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        '401':
          description: Invalid credentials
        '403':
          description: Authenticated user identity required
        '404':
          description: User not found
        '500':
          description: Unable to load the current user or evaluate capabilities
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        '200':
          description: Successful user creation
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/User"
        '401':
          description: Invalid credentials
  /users:
    get:
      operationId: getUsers
      parameters:
        - name: page
          in: query
          description: The page number
          required: false
          schema:
            type: integer
            minimum: 0
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Successful user retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
