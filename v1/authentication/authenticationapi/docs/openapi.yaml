openapi: 3.0.0
info:
  title: OpenAPI specification for auth
  version: 1.0.0
  description: This is the OpenAPI specification for the auth service.
servers:
  - url: https://localhost:8080/api/v1
    description: Local server
  - url: https://auth:8080/api/v1
  - url: http://localhost:8080/api/v1
    description: Local server
  - url: http://auth:8080/api/v1
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: OKEY
  schemas:
    VerifyKeyRequest:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          format: byte
          minLength: 1
          maxLength: 1024
    VerifyKeyResp:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    RefreshRequest:
      required:
        - refresh_token
      type: object
      properties:
        refresh_token:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    RefreshResponse:
      type: object
      required:
        - user_id
        - auth_token
      properties:
        user_id:
          type: string
          format: uuid
        auth_token:
          type: string
          minLength: 1
          maxLength: 1024
    LoginChallengeRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
    ChallengeServerResponse:
      type: object
      required:
        - challenge
        - id
        - salt
      properties:
        id:
          type: string
          format: uuid
        challenge:
          type: string
          format: byte
        salt:
          type: string
          format: byte
    ChallengeClientResponse:
      type: object
      required:
        - id
        - challenge
      properties:
        challenge:
          type: string
          format: byte
        id:
          type: string
          format: uuid
    TokenResponse:
      type: object
      required:
        - auth_token
        - refresh_token
        - user_id
      properties:
        auth_token:
          type: string
          minLength: 1
          maxLength: 1024
        refresh_token:
          type: string
          minLength: 1
          maxLength: 1024
        user_id:
          type: string
          format: uuid
    RegistrationRequest:
      type: object
      required:
      - username
      - key
      - email
      - secret
      - salt
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        key:
          type: string
          format: byte
        email:
          type: string
          minLength: 1
          maxLength: 255
        secret:
          type: string
          format: byte
    RegistrationResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    AuthenticateRequest:
      type: object
      required: 
      - token
      properties:
        token:
          type: string
    AuthenticateResponse:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
paths:
  /auth/authed:
    get:
      summary: tests if the user is authed
      description: tests if the user is authed
      operationId: isAuthed
      responses:
        '200':
          description: User is authed
        '401':
          description: User is not authed
  /auth/verify:
    post:
      summary: verify the given key
      description: verify the given key
      operationId: verifyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyKeyRequest'
      responses:
        '200':
          description: Successful verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyKeyResp'
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh token
      description: Refresh the authentication token
      operationId: refreshToken
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful token refresh
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Sets new authentication token cookie
                example: OKEY=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
        '401':
          description: Invalid credentials
  /auth/login_challenge:
    post:
      summary: Requests a challenge from the server to login
      description: Requests a challenge from the server to login
      operationId: loginChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginChallengeRequest'
      responses:
        '200':
          description: Challenge response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeServerResponse'
        '401':
          description: Invalid credentials
  /auth/login_challenge_response:
    post:
      summary: Answers the login question
      description: Answers the login question
      operationId: loginChallengeResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeClientResponse'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Sets new authentication token cookie
                example: |
                  OKEY=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
                  RKEY=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
                  UID=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
        '401':
          description: Invalid credentials
  /auth/logout:
    post:
      summary: Logs out the user
      description: Logs out the user
      operationId: logout
      responses:
        '200':
          description: Successfully logged out user
        '401':
          description: Invalid credentials
  /auth/registration:
    post:
      summary: Starts a new user registration
      description: Starts a new user registration
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Successfully registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Sets new authentication token cookie
                example: |
                  OKEY=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
                  RKEY=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict
                  UID=1234567890; Path=/; HttpOnly; Secure; SameSite=Strict 
        '409':
          description: User already registered
        '403':
          description: Unable to start user registration
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'