openapi: 3.1.0
info:
    title: Authorization Schemas
    version: 1.0.0
components:
    schemas:
        UpdateRequest:
            type: object
            required:
                - events
                - id
            properties:
                id:
                    type: string
                events:
                    type: array
                    items:
                        type: object
                        required:
                            - event
                            - data
                        properties:
                            event:
                                type: string
                            data:
                                type: object
                                additionalProperties: true
        Role:
            type: object
            required:
                - name
                - description
                - created_at
                - updated_at
                - hierarchy
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                    maxLength: 128
                description:
                    type: string
                    maxLength: 128
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                hierarchy:
                    type: integer
        User:
            type: object
            required:
                - username
                - email
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    format: uuid
                username:
                    type: string
                    maxLength: 128
                email:
                    type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        Resource:
            type: object
            required:
                - name
                - group
                - kind
                - created_at
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                    maxLength: 128
                group:
                    type: string
                    maxLength: 128
                kind:
                    type: string
                    maxLength: 128
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        Permission:
            type: object
            required:
                - created_at
                - updated_at
                - permission
            properties:
                id:
                    type: string
                    format: uuid
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                permission:
                    type: string
        DeleteRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid
        DeleteResponse:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    format: uuid
        SearchRequest:
            type: object
            required:
                - permission
            properties:
                permission:
                    type: string
                page:
                    type: number
                    minimum: 0
                pageSize:
                    type: number
                    minimum: 0

