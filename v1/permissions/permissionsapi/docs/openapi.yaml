openapi: 3.0.0
info:
  title: Authorization Permissions
  version: 1.0.0
components:
  schemas:
    CreateRequest:
      type: object
      required:
      - permission
      properties:
        permission:
          $ref: "schemas.yaml#/components/schemas/Permission"
    CreateResponse:
      type: object
      required:
        - permission
      properties:
        permission:
          $ref: "schemas.yaml#/components/schemas/Permission"
paths:
  /auth/permission:
    get:
      operationId: listPermissions
      summary: Retrieves all permissions
      parameters:
        - name: page
          in: query
          description: The page number
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          description: The page size
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful permission retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "schemas.yaml#/components/schemas/Permission"
        '401':
          description: Invalid credentials
    post:
      operationId: createPermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
        required: true
      responses:
        '200':
          description: Successful permission creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponse"
        '401':
          description: Invalid credentials
    delete:
      operationId: deletePermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "schemas.yaml#/components/schemas/DeleteRequest"
      responses:
        '200':
          description: Successful permission deletion
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/DeleteResponse"
        '401':
          description: Invalid credentials
