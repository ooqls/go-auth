user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;


    server {
        listen 80;
        server_name localhost;
        # To allow all origins with CORS in nginx, you need to set the relevant headers.
        # This does not require additional installation—just add a header in each relevant location or in the server block.
        # Example (unrestricted, development use only):
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,OKEY' always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle preflight OPTIONS requests
        # location / {
        #     if ($request_method = 'OPTIONS') {
        #         add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        #         add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,OKEY' always;
        #         add_header 'Access-Control-Allow-Credentials' 'true' always;
        #         add_header 'Content-Length' 0;
        #         add_header 'Content-Type' 'text/plain';
        #         return 204;
        #     }
        # }

        # Each location block (auth, users, roles) should enforce authentication by checking the OKEY header.
        # With plain nginx, you can use the 'auth_request' module to call a subrequest (for example, to /auth/validate) that checks the OKEY header.
        # Here is a simple pattern that assumes /auth/validate exists and will return 2xx for valid OKEY, 401/403 otherwise.

        # Auth validation endpoint is assumed at /auth/validate and is handled by the auth service.

        # Require OKEY on /users and /roles endpoints
        location /users {
            # DEBUGGING AUTH_REQUEST failures
            # 1. Log incoming headers and status in error log (access_log for debugging)
            # The 'main' log format is unknown; use the default log format or define one above.
            # access_log /var/log/nginx/users_access.log;


            # 2. Forward OKEY header to backend and auth subrequest

            # 3. Show what NGINX sees as $http_okey and auth status; verbose error log
            error_log /var/log/nginx/users_debug.log notice;

            proxy_set_header Cookie $http_cookie;

            # 4. AUTH REQUEST
            auth_request /auth/auth/authed;

            # 5. Inspect the subrequest result (set variables, log them if needed)
            # auth_request_set $auth_status $upstream_status;
            auth_request_set $user_id $upstream_http_x_user_id;
            # proxy_set_header Host $host;

            

            # 6. Return header for debugging of $auth_status
            # add_header X-Debug-Auth-Status $auth_status always;
            # Note: 'add_header' sets headers for the response sent back to the client, not to the upstream server specified in proxy_pass.
            # To pass a header to the upstream (backend), use proxy_set_header.
            # 'add_header X-User-Id $user_id always;' will only appear in the response to the client if set here,
            # but does NOT send X-User-Id to the backend (users:8080) during proxy_pass.
            #
            # If you want to pass $user_id upstream, do:
            proxy_set_header X-User-Id $user_id;
            # If you want clients to see this value as a response header (browser/devtools), do:
            # add_header X-User-Id $user_id always;

            # 7. Pass original request if authed
            rewrite ^/users/(.*) /$1 break;
            proxy_pass http://users:8080;
            # proxy_set_header Host $host;


            # 8. Optional: show auth info in response (for browser developer tools)
            # add_header X-Okey $http_okey always;
        }

        location /roles {
            rewrite ^/roles/(.*) /$1 break;
            auth_request /auth/auth/authed;
            proxy_pass http://roles:8080;
        }

        location /auth {
            rewrite ^/auth/(.*) /$1 break;
            proxy_set_header OKEY $http_okey;
            proxy_pass http://auth:8080;
        }

        location /authed_check {
            proxy_set_header OKEY $http_okey;

            proxy_pass http://auth:8080/auth/authed;

            # Capture the JSON response from /auth/authed
            proxy_set_header Accept application/json;

            # Use the ngx_http_sub_module to rewrite the response to include the user_id as a header.
            # This requires the 'sub_filter' directive and that the response be in known format.
            # Alternatively, use the 'auth_request_set' directive if available, but here we use sub_filter to pass user_id as header.

            # Below: Only works if your NGINX has Lua or 3rd-party modules.
            # Otherwise, you should parse this in the backend or with a custom error handler.

            # For simple dev, assume the backend returns the needed header "X-User-Id" itself.

            proxy_pass_request_headers on;

            # Merge/set header if backend emits user_id as header
            proxy_set_header X-User-Id $upstream_http_x_user_id;

            # If you can guarantee backend emits a header X-User-Id, the above suffices.
            # If not, NGINX out of the box can't parse JSON to header;
            # you’d need a module like lua-nginx-module to extract from JSON and set as header.

            # Example response header from backend:
            # HTTP/1.1 200 OK
            # X-User-Id: abc123-uuid

            # At that point, your clients can read X-User-Id from response headers.
        }
    }
}