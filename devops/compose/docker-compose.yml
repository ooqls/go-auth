services:
  proxy:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth
      - roles
      - users
  resources:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: unless-stopped
    command: ["/app/main", "--api", "resources", "--app-config", "/config/config/config.yaml"]
    environment:
      REMOTE_DEBUG_PORT: "2345"
    ports:
      - "2345:2345"
    volumes:
      - ./app:/config
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
      seed:
        condition: service_completed_successfully
  permissions:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: unless-stopped
    command: ["/app/main", "--api", "permissions", "--app-config", "/config/config/config.yaml"]
    environment:
      REMOTE_DEBUG_PORT: "2346"
    ports:
      - "2346:2346"
    volumes:
      - ./app:/config
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
      seed:
        condition: service_completed_successfully
  roles:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: unless-stopped
    command: ["/app/main", "--api", "roles", "--app-config", "/config/config/config.yaml"]
    environment:
      REMOTE_DEBUG_PORT: "2347"
    ports:
      - "2347:2347"
    volumes:
      - ./app:/config
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
      seed:
        condition: service_completed_successfully
  auth:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: unless-stopped
    command: ["/app/main", "--api", "authentication", "--app-config", "/config/config/config.yaml"]
    environment:
      REMOTE_DEBUG_PORT: "2348"
    ports:
      - "2348:2348"
    volumes:
      - ./app:/config
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
      seed:
        condition: service_completed_successfully
  users:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: unless-stopped
    command: ["/app/run.sh", "--api", "users", "--app-config", "/config/config/config.yaml"]
    environment:
      REMOTE_DEBUG_PORT: "2349"
    ports:
      - "2349:2349"
    volumes:
      - ./app:/config
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
      seed:
        condition: service_completed_successfully
  seed:
    build:
      context: ../..
      dockerfile: dockerfiles/dev/base.dockerfile
    image: samrreynolds4/base:main
    restart: "no"
    command: ["/app/main", "--api", "seed", "--app-config", "/config/config/seed.yaml"]
    volumes:
      - ./app:/config
      - ./migrations:/migrations
      - ./seed:/seed
    depends_on:
      - db
      - valkey

# If you need databases, add the following as an example:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
      POSTGRES_SSL: enabled
      POSTGRES_CA_CERT: /tls/ca.crt
      POSTGRES_SERVER_CERT: /tls/server.crt
      POSTGRES_SERVER_KEY: /tls/server.key
    ports:
     - "5432:5432"
    volumes:
    - ./app/tls:/tls
  valkey:
    image: valkey/valkey:latest
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    restart: unless-stopped
    volumes:
      - ./app/tls:/tls
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf
      - ./valkey/acl.conf:/usr/local/etc/valkey/acl.conf
    ports:
    - "6379:6379"

