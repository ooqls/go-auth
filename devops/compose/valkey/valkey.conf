protected-mode no
aclfile /usr/local/etc/valkey/acl.conf

# Disable non-TLS port (optional but recommended)
port 0

# Enable TLS port (Redis default is 6379, but you can change)
tls-port 6379

# Paths to certs inside the container
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt

# Require client cert? (optional)
# If you want mutual TLS (clients must have certs), add:
# tls-auth-clients yes
# Otherwise:
tls-auth-clients no

# Optional tuning
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
