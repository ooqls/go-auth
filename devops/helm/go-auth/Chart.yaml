apiVersion: v2
name: go-auth
description: Authentication and RBAC service
type: application
version: 0.1.0
appVersion: "latest"

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: valkey
    version: "2.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: valkey.enabled
