{{- $root := . }}
{{- range $api, $cfg := .Values.apis }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-auth.fullname" $root }}-{{ $api }}
  labels:
    {{- include "go-auth.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $api }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "go-auth.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $api }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "go-auth.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $api }}
    spec:
      containers:
        - name: {{ $api }}
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - "./main"
            - "--api"
            - {{ $api | quote }}
            - "--app-config"
            - "/config/config.yaml"
          ports:
            - name: http
              containerPort: {{ $root.Values.gin.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            {{- include "go-auth.commonVolumeMounts" $root | nindent 12 }}
      volumes:
        {{- include "go-auth.commonVolumes" $root | nindent 8 }}
{{- end }}
{{- end }}
