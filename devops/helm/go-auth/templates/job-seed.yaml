{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "go-auth.fullname" . }}-seed
  labels:
    {{- include "go-auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    # Re-run seed on every helm upgrade
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "go-auth.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "go-auth.postgresHost" . }} {{ .Values.postgres.port }}; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "./main"
            - "--api"
            - "seed"
            - "--app-config"
            - "/config/seed.yaml"
          volumeMounts:
            - name: seed-config
              mountPath: /config/seed.yaml
              subPath: seed.yaml
            - name: registry-config
              mountPath: /config/registry/registry.yaml
              subPath: registry.yaml
            - name: db-passwords
              mountPath: /run/secrets/db
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /config/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: seed-config
          configMap:
            name: {{ include "go-auth.fullname" . }}-seed-config
        - name: registry-config
          configMap:
            name: {{ include "go-auth.fullname" . }}-registry
        - name: db-passwords
          secret:
            secretName: {{ include "go-auth.fullname" . }}-db-passwords
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ include "go-auth.tlsSecretName" . }}
        {{- end }}
{{- end }}
