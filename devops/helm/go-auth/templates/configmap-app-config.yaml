apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-auth.fullname" . }}-app-config
  labels:
    {{- include "go-auth.labels" . | nindent 4 }}
data:
  config.yaml: |
    logging_api:
      enabled: false
      port: 0
    gin:
      enabled: true
      port: {{ .Values.gin.port }}
      cors:
        enabled: {{ .Values.gin.cors.enabled }}
        allow_all_origins: {{ .Values.gin.cors.allowAllOrigins }}
        allow_credentials: {{ .Values.gin.cors.allowCredentials }}
        allow_methods:
          {{- range .Values.gin.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        headers:
          {{- range .Values.gin.cors.headers }}
          - {{ . }}
          {{- end }}
        expose_headers:
          {{- range .Values.gin.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
    docs:
      enabled: true
      docs_api_path: /api/v1/docs
    tls:
      enabled: {{ .Values.tls.enabled }}
      ca_path: /config/tls/ca.crt
      cert_file: /config/tls/server.crt
      key_file: /config/tls/server.key
    jwt:
      enabled: true
      rsa_key_path: /config/jwt/jwt.key
      rsa_pub_key_path: /config/jwt/jwt.pub
      token_configurations:
        - audience:
            - auth
          issuer: auth
          validity_duration_seconds: 3600
        - audience:
            - refresh
          issuer: refresh
          validity_duration_seconds: 3600
    sql:
      enabled: true
      sql_package: SQLX
      sql_files_dirs:
        - /migrations/
    registry:
      enabled: true
      path: /config/registry/registry.yaml
    health:
      enabled: false
